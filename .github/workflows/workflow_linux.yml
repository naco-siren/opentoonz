name: Linux Build

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.head_ref != '' }}

on:
  push:
    paths:
      - '**/*'                   # Include all files in the repository
      - '!appveyor.yml'          # Ignore changes in AppVeyor
      - '!README.md'             # Exclude README
      - '!doc/**'                # Exclude documentation
      - '!**/.github/**'         # Exclude everything in .github folder
      - '.github/workflows/workflow_linux.yml'  # Include Linux workflow file
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - '**/*'
      - '!appveyor.yml'
      - '!README.md'
      - '!doc/**'
      - '!**/.github/**'
      - '.github/workflows/workflow_linux.yml'

# Packages (.AppImage, .app/.dmg, the Windows folder) are made only where
# someone uses them: pushes to master, runs started by hand, and pull
# requests labelled "package" (Q4 of doc/nexttoonz_cli_ci.md). Labelling a
# pull request "package" starts a run that packages.
env:
  NEXTTOONZ_PACKAGE: ${{ github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'package') }}

jobs:
  Ubuntu:
    # A label other than "package" changes nothing to build.
    if: github.event.action != 'labeled' || github.event.label.name == 'package'
    # Build on the oldest supported LTS: glibc/libstdc++ symbol versioning is
    # backward compatible only, so an AppImage built on 24.04 requires
    # GLIBC_2.38 / GLIBCXX_3.4.32 and will not start on 22.04 (see #7001).
    # Modern-toolchain coverage comes from the Fedora job below.
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    steps:
    - uses: actions/checkout@v6

    - name: Install libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake pkg-config ninja-build ccache libboost-all-dev qtbase5-dev qt5-qmake qtscript5-dev qttools5-dev qttools5-dev-tools qtmultimedia5-dev qtwayland5 libqt5svg5-dev libqt5opengl5-dev libqt5multimedia5-plugins libqt5serialport5-dev libsuperlu-dev liblz4-dev libusb-1.0-0-dev liblzo2-dev libpng-dev libjpeg-dev libglew-dev freeglut3-dev libfreetype6-dev libjson-c-dev libmypaint-dev libopencv-dev libturbojpeg-dev libomp-dev libfuse2 libgtest-dev xvfb mesa-utils libgl1-mesa-dri python3-numpy python3-pil \
          curl zip unzip

    - name: Set up cache
      run: mkdir -p /home/runner/.ccache

    - uses: actions/cache@v5
      with:
        path: /home/runner/.ccache
        key: ${{ runner.os }}-${{ matrix.compiler }}-${{ github.sha }}
        restore-keys: | 
          ${{ runner.os }}-${{ matrix.compiler }}-
          ${{ runner.os }}-

    - name: Build libtiff
      run: |
        cd thirdparty/tiff-4.0.3
        CFLAGS='-fPIC' CXXFLAGS='-fPIC' ./configure --disable-jbig
        make -j $(nproc)

    # Skia, for tnzskia (WITH_SKIA): built from source through vcpkg, see
    # ci-scripts/skia/vcpkg_skia.sh. Both matrix entries share the one copy
    # built with GCC: clang links against libstdc++ too, so the ABI is the
    # same. The install tree is cached, keyed on the image, the compiler
    # version and the manifest; a hit skips vcpkg altogether. Saved right
    # after the build so that a failing test does not lose it.
    - name: Skia cache key
      id: skia-key
      run: echo "key=skia-vcpkg-$ImageOS-x64-linux-release-gcc$(gcc -dumpfullversion)" >> "$GITHUB_OUTPUT"

    - name: Restore Skia
      id: skia-cache
      uses: actions/cache/restore@v5
      with:
        path: ${{ runner.temp }}/skia-vcpkg
        key: ${{ steps.skia-key.outputs.key }}-${{ hashFiles('ci-scripts/skia/vcpkg.json', 'ci-scripts/skia/vcpkg_skia.sh') }}

    - name: Build Skia
      if: steps.skia-cache.outputs.cache-hit != 'true'
      env:
        CC: gcc
        CXX: g++
      run: ci-scripts/skia/vcpkg_skia.sh "$RUNNER_TEMP/skia-vcpkg"

    - name: Save Skia
      if: steps.skia-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: ${{ runner.temp }}/skia-vcpkg
        key: ${{ steps.skia-key.outputs.key }}-${{ hashFiles('ci-scripts/skia/vcpkg.json', 'ci-scripts/skia/vcpkg_skia.sh') }}

    - name: Build
      run: |
        export CCACHE_DIR=/home/runner/.ccache
        export CC="ccache ${{ matrix.cc }}"
        export CXX="ccache ${{ matrix.cxx }}"
        cd toonz
        mkdir build
        cd build
        cmake ../sources -G Ninja -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DCMAKE_C_COMPILER=${{ matrix.cc }} -DWITH_TRANSLATION=OFF \
          -DWITH_SKIA=ON -Dunofficial-skia_DIR="$RUNNER_TEMP/skia-vcpkg/x64-linux-release/share/unofficial-skia"
        ninja

    - name: Test
      run: |
        mkdir -p "$RUNNER_TEMP/results/junit"
        cd toonz/build
        ctest --output-on-failure --timeout 900 --output-junit "$RUNNER_TEMP/results/junit/ctest.xml"

    - name: Upload golden renders on failure
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: golden-renders-${{ matrix.compiler }}-${{ github.sha }}
        path: |
          toonz/build/golden/*/out/*.png
          toonz/build/golden/*/diff/*.png
        if-no-files-found: ignore

    - name: Collect results
      # The machine-readable results (JUnit, golden JSON), uploaded on every
      # run: doc/nexttoonz_cli_ci.md, section 4.3.
      if: always()
      run: tools/ci/collect_results.sh toonz/build "$RUNNER_TEMP/results"

    - name: Upload results
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: results-linux-${{ matrix.compiler }}-${{ github.sha }}
        path: ${{ runner.temp }}/results
        if-no-files-found: ignore

    - name: Install
      # The installed tree is what the smoke test below runs.
      run: |
        cd toonz/build
        sudo ninja install

    - name: Packaging skipped
      if: env.NEXTTOONZ_PACKAGE != 'true'
      run: echo "No AppImage on this run (only master, manual runs and PRs labelled package)."

    - name: Create Artifact
      if: env.NEXTTOONZ_PACKAGE == 'true'
      run: |
        cd toonz/build
        mkdir -p appdir/usr
        cp -r /opt/opentoonz/* appdir/usr
        cp appdir/usr/share/applications/*.desktop appdir
        cp appdir/usr/share/icons/hicolor/*/apps/*.png appdir

        mkdir artifact
        # Copy rather than move: the AppImage keeps its own
        # usr/share/opentoonz/stuff so it can seed a config when run on its
        # own, while the tarball still ships portablestuff next to it for
        # portable-mode testing.
        cp -r appdir/usr/share/opentoonz/stuff artifact/portablestuff

        wget -q -c 'https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage'
        wget -q -c 'https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage'
        wget -q -c 'https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage'
        chmod 755 linuxdeploy-x86_64.AppImage
        chmod 755 linuxdeploy-plugin-qt-x86_64.AppImage
        chmod 755 linuxdeploy-plugin-appimage-x86_64.AppImage

        cat << EOF > apprun.sh
        #!/usr/bin/env bash
        exec "\${APPDIR}/usr/bin/OpenToonz"
        EOF
        chmod 755 apprun.sh

        export LD_LIBRARY_PATH='appdir/usr/lib/opentoonz'
        # appimagetool's AppStream check fetches URLs from the .appdata.xml
        # (e.g. the issue tracker link) to confirm they're reachable; a
        # transient network error there fails the whole build. Skip it.
        export LDAI_NO_APPSTREAM=1
        ./linuxdeploy-x86_64.AppImage --appdir=appdir --plugin=qt --output=appimage --custom-apprun=apprun.sh \
        --executable=appdir/usr/bin/lzocompress \
        --executable=appdir/usr/bin/lzodecompress \
        --executable=appdir/usr/bin/tcleanup \
        --executable=appdir/usr/bin/tcomposer \
        --executable=appdir/usr/bin/tconverter \
        --executable=appdir/usr/bin/tfarmcontroller \
        --executable=appdir/usr/bin/tfarmserver
        mv OpenToonz*.AppImage artifact/OpenToonz.AppImage
        ARTIFACT_NAME=Opentoonz-${{ runner.os }}-${{ matrix.compiler }}-${{ github.sha }}
        mv artifact ${ARTIFACT_NAME}
        tar zcf ${ARTIFACT_NAME}.tar.gz ${ARTIFACT_NAME}

    - name: Smoke test the installed tree
      # Nothing else in CI runs a built binary. tconverter seeds before it
      # parses arguments, so a bare invocation does the work and exits 1.
      run: |
        set -eu
        export QT_QPA_PLATFORM=offscreen
        CONF=.config/OpenToonz

        # $ORIGIN RPATH resolves the bundled libraries without LD_LIBRARY_PATH
        ! ldd /opt/opentoonz/bin/tconverter | grep 'not found'

        # first run seeds the default root
        export HOME="$(mktemp -d)"
        timeout 120 /opt/opentoonz/bin/tconverter || true
        test -d "$HOME/$CONF/stuff/profiles"
        grep -q "^TOONZROOT=$HOME/$CONF/stuff$" "$HOME/$CONF/SystemVar.ini"

        # a root configured elsewhere is left alone, present or not
        export HOME="$(mktemp -d)"
        mkdir -p "$HOME/$CONF"
        printf '[General]\nTOONZROOT=/nonexistent/elsewhere\n' > "$HOME/$CONF/SystemVar.ini"
        timeout 120 /opt/opentoonz/bin/tconverter || true
        test ! -e "$HOME/$CONF/stuff"
        grep -q '^TOONZROOT=/nonexistent/elsewhere$' "$HOME/$CONF/SystemVar.ini"

        # an ini without a root gets one, and keeps its other keys (#7001)
        export HOME="$(mktemp -d)"
        mkdir -p "$HOME/$CONF"
        printf '[General]\nTOONZPROFILES=/keep/me\n' > "$HOME/$CONF/SystemVar.ini"
        timeout 120 /opt/opentoonz/bin/tconverter || true
        grep -q "^TOONZROOT=$HOME/$CONF/stuff$" "$HOME/$CONF/SystemVar.ini"
        grep -q '^TOONZPROFILES=/keep/me$' "$HOME/$CONF/SystemVar.ini"

    - uses: actions/upload-artifact@v6
      if: env.NEXTTOONZ_PACKAGE == 'true'
      with:
        name: Opentoonz-${{ runner.os }}-${{ matrix.compiler }}-${{ github.sha }}
        path: toonz/build/Opentoonz-${{ runner.os }}-${{ matrix.compiler }}-${{ github.sha }}.tar.gz

  # Compile-only: catches Fedora-specific breakage (package renames, newer
  # GCC/Qt) that the Ubuntu job cannot. Deliberately builds no AppImage.
  # Built without Skia (WITH_SKIA is off by default), so it also keeps the
  # OpenGL-only configuration compiling; it runs no golden tests.
  Fedora:
    # A label other than "package" changes nothing to build.
    if: github.event.action != 'labeled' || github.event.label.name == 'package'
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
    - name: Install prerequisites
      # actions/checkout needs git and tar, absent from the base image
      run: dnf install -y git tar gzip

    - uses: actions/checkout@v6

    - name: Install libraries
      run: |
        dnf install -y gcc gcc-c++ automake libtool make git cmake ninja-build \
          boost boost-devel SuperLU SuperLU-devel lz4-devel xz-devel \
          libusb1-devel lzo-devel libjpeg-turbo-devel turbojpeg-devel \
          glew glew-devel freeglut freeglut-devel freetype-devel libpng-devel \
          blas blas-devel json-c-devel opencv-devel libmypaint-devel \
          qt5-qtbase-devel qt5-qtsvg qt5-qtsvg-devel qt5-qtscript qt5-qtscript-devel \
          qt5-qttools qt5-qttools-devel qt5-qttools-static qt5-qtmultimedia \
          qt5-qtmultimedia-devel qt5-qtserialport-devel qt5-qtwayland \
          pkgconf-pkg-config

    - name: Build libtiff
      run: |
        cd thirdparty/tiff-4.0.3
        CFLAGS='-fPIC' CXXFLAGS='-fPIC' ./configure --disable-jbig
        make -j $(nproc)

    - name: Build
      run: |
        cd toonz
        mkdir build
        cd build
        # -Werror=return-type mirrors the distro %optflags that RPM packagers
        # build with. A missing return is only a warning in our default build,
        # so it survives review and breaks packaging instead (see #6940).
        cmake ../sources -G Ninja -DWITH_TRANSLATION=OFF \
          -DCMAKE_CXX_FLAGS=-Werror=return-type
        ninja
