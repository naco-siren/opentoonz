name: MacOS Build

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.head_ref != '' }}

on:
  push:
    paths:
      - '**/*'                                  # Include all files in the repository
      - '!appveyor.yml'                         # Ignore changes in AppVeyor
      - '!README.md'                            # Exclude README
      - '!doc/**'                               # Exclude documentation
      - '!**/.github/**'                        # Exclude everything in .github folder
      - '.github/workflows/workflow_macos.yml'  # Include MacOs workflow file
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - '**/*'
      - '!appveyor.yml'
      - '!README.md'
      - '!doc/**'
      - '!**/.github/**'
      - '.github/workflows/workflow_macos.yml'
  workflow_dispatch:

# Packages (.AppImage, .app/.dmg, the Windows folder) are made only where
# someone uses them: pushes to master, runs started by hand, and pull
# requests labelled "package" (Q4 of doc/nexttoonz_cli_ci.md). Labelling a
# pull request "package" starts a run that packages.
env:
  NEXTTOONZ_PACKAGE: ${{ github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'package') }}

jobs:
  # The core libraries without Qt (WITH_QT=OFF; doc/nexttoonz_core_noqt.md):
  # what has been moved off Qt so far, built where no Qt is installed, with
  # its unit tests, also in the iPad simulator. x86_64 only, by the owner's
  # platform order (Q8 of that document).
  macOS-noqt:
    # A label other than "package" changes nothing to build.
    if: github.event.action != 'labeled' || github.event.label.name == 'package'
    timeout-minutes: 60
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6

      - name: Install libraries
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          # The libraries the configuration looks for, as in the macOS job,
          # but no Qt: nothing of the build may find it.
          for pkg in pkg-config glew lz4 libjpeg libpng lzo boost libusb libmypaint jpeg-turbo ninja opencv@4 googletest; do
            brew ls --versions "$pkg" >/dev/null || brew install "$pkg"
          done
          if brew list --formula | grep -q '^qt'; then
            echo "Qt is installed on the runner:"; brew list --formula | grep '^qt'
          fi

      - name: Build libtiff
        run: |
          cd thirdparty/tiff-4.0.3
          CFLAGS='-fPIC' CXXFLAGS='-fPIC' ./configure --disable-lzma
          make -j $(sysctl -n hw.ncpu)

      - name: Restore Skia
        id: skia-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/skia-pack/*.zip
          key: skia-pack-x64-${{ hashFiles('ci-scripts/skia/skia_pack.sh') }}
      - name: Fetch Skia
        run: |
          dir="$(ci-scripts/skia/skia_pack.sh x64 "$RUNNER_TEMP/skia-pack" | tail -n 1)"
          echo "SKIA_PACK_DIR=$dir" >> "$GITHUB_ENV"

      # Skia for the iPad simulator: since step 8d the core draws vector
      # images with it there too (tests/core/run_ios_noqt.sh).
      - name: Restore Skia for the iPad simulator
        id: skia-ios-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/skia-pack-ios/*.zip
          key: skia-pack-iosSim-x64-${{ hashFiles('ci-scripts/skia/skia_pack.sh') }}
      - name: Fetch Skia for the iPad simulator
        run: |
          dir="$(ci-scripts/skia/skia_pack.sh iosSim-x64 "$RUNNER_TEMP/skia-pack-ios" | tail -n 1)"
          echo "IOS_SKIA_PACK_DIR=$dir" >> "$GITHUB_ENV"
      - name: Save Skia for the iPad simulator
        if: steps.skia-ios-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/skia-pack-ios/*.zip
          key: skia-pack-iosSim-x64-${{ hashFiles('ci-scripts/skia/skia_pack.sh') }}

      - name: GoogleTest sources for the iPad simulator
        run: git clone --quiet --depth 1 --branch v1.17.0 https://github.com/google/googletest.git "$RUNNER_TEMP/googletest"

      - name: Build and test without Qt
        env:
          NEXTTOONZ_CTEST_JUNIT: ${{ runner.temp }}/results/junit/ctest.xml
        run: |
          mkdir -p "$RUNNER_TEMP/results/junit"
          export PKG_CONFIG_PATH="$(brew --prefix jpeg-turbo)/lib/pkgconfig:$PKG_CONFIG_PATH"
          ci-scripts/noqt/noqt_test.sh toonz/build-noqt "$RUNNER_TEMP/googletest" "$IOS_SKIA_PACK_DIR" \
            -DCMAKE_PREFIX_PATH="$(brew --prefix googletest)" \
            -DOpenCV_DIR=$(brew --prefix opencv@4)/lib/cmake/opencv4 \
            -DWITH_SKIA=ON -DNEXTTOONZ_SKIA_PACK_DIR="$SKIA_PACK_DIR"

      - name: Collect results
        # The machine-readable results (JUnit, golden JSON), uploaded on every
        # run: doc/nexttoonz_cli_ci.md, section 4.3.
        if: always()
        run: tools/ci/collect_results.sh toonz/build-noqt "$RUNNER_TEMP/results"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: results-macos-noqt-${{ github.sha }}
          path: ${{ runner.temp }}/results
          if-no-files-found: ignore

  macOS:
    # A label other than "package" changes nothing to build.
    if: github.event.action != 'labeled' || github.event.label.name == 'package'
    timeout-minutes: 180 # Stop job if it exceeds expected build time
    # NextToonz builds macOS arm64 and x86_64 at parity (doc/nexttoonz_plan.md, D5).
    # - `macos-15` is an Apple Silicon (arm64, M1 3-vCPU) image.
    # - `macos-15-intel` is the last x86_64 image GitHub offers; it goes away in
    #   August 2027 (https://github.com/actions/runner-images/issues/13045).
    # - `macos-14` is being retired in November 2026, do not use it
    #   (https://github.com/actions/runner-images/issues/13518).
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            skia_arch: arm64
          - runner: macos-15-intel
            arch: x86_64
            skia_arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Clean Python symlinks
        run: |
          # Remove potentially conflicting Python symlinks
          find /usr/local/bin -type l \( -name "python*" -o -name "pip*" -o -name "2to3*" -o -name "idle*" -o -name "pydoc*" \) \
            -exec sh -c 'file -b {} | grep -q "symbolic link to .*Python.framework" && echo "Removing {}" && rm {}' \;
          # Ensure Homebrew Python is properly linked
          for py_version in python@3.11 python@3.12 python@3.13 python@3.14; do
            if brew list --versions $py_version >/dev/null; then
              brew unlink $py_version || true
            fi
          done
          brew link --overwrite --force python@3.14 || true

      - name: Install libraries
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          checkPkgAndInstall() {
            for pkg in "$@"; do
              if brew ls --versions "$pkg" >/dev/null; then
                echo "$pkg already installed"
              else
                brew install "$pkg"
              fi
            done
          }

          checkPkgAndInstall pkg-config glew lz4 libjpeg libpng lzo boost libusb libmypaint ccache jpeg-turbo ninja opencv@4 openjph openexr googletest

          brew list --formula | grep '^qt' | grep -v '@5' | xargs -n1 brew unlink || true

          brew install qt@5
          brew unlink qt@5 || true
          brew link qt@5 || true

      - name: Set up cache
        run: |
          mkdir -p /Users/runner/.ccache
      # restore + save instead of actions/cache so that the compiler cache is
      # kept even when the Test step fails: a failed job otherwise skips the
      # post step and the next push rebuilds everything from scratch.
      - uses: actions/cache/restore@v5
        with:
          path: /Users/runner/.ccache
          key: ${{ runner.os }}-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-${{ matrix.arch }}-

      - name: Build libtiff
        run: |
          cd thirdparty/tiff-4.0.3
          CFLAGS='-fPIC' CXXFLAGS='-fPIC' ./configure --disable-lzma
          make -j $(sysctl -n hw.ncpu)
          # Not installed: the build takes the headers and the static library
          # from thirdparty. Installing it used to hide that a Homebrew libtiff
          # in /usr/local/include shadowed the bundled headers on Intel Macs.
      # Skia, for tnzskia (WITH_SKIA): the prebuilt JetBrains skia-pack of
      # the runner's architecture, pinned with its SHA-256 in
      # ci-scripts/skia/skia_pack.sh. Only the zip is cached; it is unpacked
      # and checked on every run.
      - name: Restore Skia
        id: skia-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/skia-pack/*.zip
          key: skia-pack-${{ matrix.skia_arch }}-${{ hashFiles('ci-scripts/skia/skia_pack.sh') }}
      - name: Fetch Skia
        run: |
          dir="$(ci-scripts/skia/skia_pack.sh ${{ matrix.skia_arch }} "$RUNNER_TEMP/skia-pack" | tail -n 1)"
          echo "SKIA_PACK_DIR=$dir" >> "$GITHUB_ENV"
      - name: Save Skia
        if: steps.skia-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/skia-pack/*.zip
          key: skia-pack-${{ matrix.skia_arch }}-${{ hashFiles('ci-scripts/skia/skia_pack.sh') }}
      - name: Build
        env:
          CCACHE_DIR: /Users/runner/.ccache
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix jpeg-turbo)/lib/pkgconfig:$PKG_CONFIG_PATH"
          cd toonz
          rm -rf build
          mkdir -p build
          cd build
          cmake ../sources -G Ninja \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DQT_PATH=$(brew --prefix qt@5)/lib \
            -DQt5_DIR=$(brew --prefix qt@5)/lib/cmake/Qt5 \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@5)/lib/cmake/Qt5;$(brew --prefix googletest)" \
            -DOpenCV_DIR=$(brew --prefix opencv@4)/lib/cmake/opencv4 \
            -DWITH_TRANSLATION=OFF \
            -DWITH_SKIA=ON -DNEXTTOONZ_SKIA_PACK_DIR="$SKIA_PACK_DIR"
          ninja -j $(sysctl -n hw.ncpu)
      - name: Save cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: /Users/runner/.ccache
          key: ${{ runner.os }}-${{ matrix.arch }}-${{ github.sha }}
      - name: Test
        env:
          # every checksum of test_vector_noqt.cpp, kept below when a test
          # fails: the table for a new platform comes from there
          NEXTTOONZ_HASHES_FILE: ${{ runner.temp }}/vector_hashes.inc
        run: |
          python3 -m pip install --quiet --break-system-packages numpy pillow || python3 -m pip install --quiet numpy pillow
          mkdir -p "$RUNNER_TEMP/results/junit"
          cd toonz/build
          ctest --output-on-failure --timeout 600 --output-junit "$RUNNER_TEMP/results/junit/ctest.xml"
      - name: Upload vector checksums on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: vector-hashes-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/vector_hashes.inc
          if-no-files-found: ignore
      - name: Upload golden renders on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: golden-renders-${{ matrix.arch }}-${{ github.sha }}
          path: |
            toonz/build/golden/*/out/*.png
            toonz/build/golden/*/diff/*.png
          if-no-files-found: ignore
      - name: Collect results
        # The machine-readable results (JUnit, golden JSON), uploaded on every
        # run: doc/nexttoonz_cli_ci.md, section 4.3.
        if: always()
        run: tools/ci/collect_results.sh toonz/build "$RUNNER_TEMP/results"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: results-macos-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/results
          if-no-files-found: ignore
      - name: Packaging skipped
        if: env.NEXTTOONZ_PACKAGE != 'true'
        run: echo "No .app/.dmg on this run (only master, manual runs and PRs labelled package)."
      - name: Introduce Libraries and Stuff
        if: env.NEXTTOONZ_PACKAGE == 'true'
        run: |
          cd toonz/build/toonz
          cp -pr ../../../stuff OpenToonz.app/portablestuff
          $(brew --prefix qt@5)/bin/macdeployqt OpenToonz.app -verbose=0 -always-overwrite \
            -executable=OpenToonz.app/Contents/MacOS/lzocompress \
            -executable=OpenToonz.app/Contents/MacOS/lzodecompress \
            -executable=OpenToonz.app/Contents/MacOS/tcleanup \
            -executable=OpenToonz.app/Contents/MacOS/tcomposer \
            -executable=OpenToonz.app/Contents/MacOS/tconverter \
            -executable=OpenToonz.app/Contents/MacOS/tfarmcontroller \
            -executable=OpenToonz.app/Contents/MacOS/tfarmserver
      - name: Modify Library Paths
        if: env.NEXTTOONZ_PACKAGE == 'true'
        run: |
          cd toonz/build/toonz/OpenToonz.app/Contents/Frameworks
          for TARGETLIB in *.dylib; do
            otool -L "$TARGETLIB" | grep ".dylib" | grep -v "$TARGETLIB" | grep -v "@executable_path/../Frameworks" | awk '{print $1}' | while read -r FROMPATH; do
              LIBNAME=$(basename "$FROMPATH")
              if [[ -e ./$LIBNAME ]]; then
                install_name_tool -change "$FROMPATH" "@executable_path/../Frameworks/$LIBNAME" "$TARGETLIB"
              fi
            done
          done
      - name: Create Artifact
        if: env.NEXTTOONZ_PACKAGE == 'true'
        run: |
          cd toonz/build/toonz
          echo "Creating DMG..."
          ATTEMPT=1
          until $(brew --prefix qt@5)/bin/macdeployqt OpenToonz.app -dmg -verbose=0 && [ -f OpenToonz.dmg ]; do
            echo "Attempt $ATTEMPT failed to build DMG."
            if [ $ATTEMPT -eq 10 ]; then
              echo ">>> DMG file creation failed after 10 attempts. Aborting!"
              exit 1
            fi
            ATTEMPT=$((ATTEMPT + 1))
            echo "Retrying in 5 seconds..."
            sleep 5
          done
          echo "DMG created successfully."
      - uses: actions/upload-artifact@v6
        if: env.NEXTTOONZ_PACKAGE == 'true'
        with:
          name: Opentoonz-${{ runner.os }}-${{ matrix.arch }}-${{ github.sha }}
          path: toonz/build/toonz/OpenToonz.dmg
